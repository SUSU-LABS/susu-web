name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    env:
      # Placeholder browser-safe values so build/typecheck never need real secrets.
      VITE_APP_URL: http://localhost:5173
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_STELLAR_NETWORK: testnet
      VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      VITE_FACTORY_CONTRACT_ID: ''
      VITE_USDC_CONTRACT_ID: ''
      VITE_EXPLORER_BASE_URL: https://stellar.expert/explorer/testnet

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan can see secrets that were committed
          # and later removed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on a known advisory in any dependency, direct or
      # transitive. It is here, before the slow steps, because a vulnerable
      # dependency is worth discovering in seconds rather than after a full test
      # run — and because a gate that runs late is one people learn to ignore.
      #
      # `--audit-level high` is the threshold rather than the default of `low`.
      # Low and moderate advisories in this tree have so far been confined to
      # build-time tooling that is never shipped and never serves traffic; failing
      # every push on those trains people to re-run CI without reading it, which
      # is worse than not having the gate. High and critical are the severities
      # with a real exploit path, and a failure there should stop a merge.
      #
      # This gate can go red without anyone changing this repository, because the
      # advisory database is amended continuously. That is the intended
      # behaviour: it means the next push is held until somebody looks.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs the suite with coverage so the thresholds in `vite.config.ts` are
      # enforced here: a change that drops coverage below the floor fails CI
      # rather than being noticed later, if at all.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The catalogue is a dependency of nothing, which is exactly why it rots
      # without anyone noticing: nothing downstream of it fails when it stops
      # building. Running it here is what keeps a Storybook major drifting out
      # of step with Vite from going unseen.
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

      - name: Verify no server-side credentials were bundled
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "dist/ not found; skipping bundle credential scan"
            exit 0
          fi
          pnpm check:bundle

      # Guards the route-level code splitting from #24: fails if the Stellar
      # SDK becomes reachable from the entry chunk again or the entry grows
      # past its budget.
      - name: Verify bundle size budget
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "dist/ not found; skipping bundle size check"
            exit 0
          fi
          pnpm check:bundle-size
