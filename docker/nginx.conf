# The served application — installed as `/etc/nginx/conf.d/default.conf` by the
# runtime stage of the Dockerfile.
#
# A `conf.d` fragment rather than a whole `nginx.conf`: the image's own main file
# already sets the worker user, pid path and log destinations, and replacing it
# wholesale is how an image ends up running as root by accident.

server {
  # 8080, not 80: the image runs as the unprivileged `nginx` user, which cannot
  # bind a port below 1024. Both the Dockerfile's EXPOSE and the healthcheck
  # follow this number.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The nginx version in an error page is a shopping list for a scanner and is
  # useful to nobody else.
  server_tokens off;

  # The initial page load pulls ~0.8 MB of JavaScript before compression, and
  # it is text. Route-level code splitting keeps the Stellar SDK out of the
  # initial graph: it ships in its own chunk, fetched only when an
  # authenticated route needs it. The full app, all route chunks included,
  # is ~1.5 MB.
  # `gzip_vary` is not optional: without it a cache may hand the compressed body
  # to a client that did not ask for it.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/plain;

  # Vite writes every script and stylesheet as `<name>-<content hash>.<ext>`
  # under `/assets`, so the URL changes whenever the bytes do. That is the whole
  # reason `immutable` is honest here: nothing is ever served from a URL whose
  # contents have changed.
  location /assets/ {
    # `=404` rather than the SPA fallback. A missing hashed asset is a broken
    # deployment, and answering it with `index.html` would surface as a MIME
    # error ("expected a JavaScript module, got text/html") that points at the
    # wrong problem — in a browser it looks like a syntax error in the app.
    try_files $uri =404;

    include /etc/nginx/snippets/susu-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Everything else, and the SPA fallback.
  location / {
    # React Router owns the URLs: `/app/groups/123` is a router route, not a file
    # on disk, so `$uri` misses and the request is answered with the entry
    # document, which mounts the router and resolves the route in the browser.
    # Without this line a refresh, a deep link, or the link in a confirmation
    # email would return nginx's 404 instead of the app.
    #
    # `$uri` is tried first so that real files — anything added to `public/`
    # later — are served rather than shadowed by the fallback.
    try_files $uri /index.html;

    include /etc/nginx/snippets/susu-security-headers.conf;

    # `index.html` is the one file whose contents change without its URL
    # changing, so it is the one file that must never be cached: a browser
    # holding a stale copy would keep requesting the previous build's asset
    # hashes, which are no longer deployed. The fallback above is an internal
    # redirect to `/index.html`, so this header is what the deep link receives
    # as well as a direct request.
    add_header Cache-Control "no-store" always;
  }

  # There is deliberately no `error_page 404 /index.html`. It is the obvious
  # thing to write next to a SPA fallback and it would undo the line above that
  # matters most: a missing hashed asset would answer `200 text/html`, and the
  # browser would report a module that is not a module. The fallback belongs in
  # `try_files`, where it applies only to a path the router could own.
}
